            type: string
            description: 'User ID for CSRF validation.'
            example: 664f1a2b3c4d5e6f7a8b9c0a
      responses:
        302:
          description: ''
          content:
            text/plain:
              schema:
                oneOf:
                  -
                    description: ''
                    type: string
                    example: 'Redirects to frontend with ?google=connected or ?google=error'
                  -
                    description: ''
                    type: string
                    example: "<!DOCTYPE html>\n<html>\n    <head>\n        <meta charset=\"UTF-8\" />\n        <meta http-equiv=\"refresh\" content=\"0;url='https://jobs-employment-app.vercel.app/settings?google=error'\" />\n\n        <title>Redirecting to https://jobs-employment-app.vercel.app/settings?google=error</title>\n    </head>\n    <body>\n        Redirecting to <a href=\"https://jobs-employment-app.vercel.app/settings?google=error\">https://jobs-employment-app.vercel.app/settings?google=error</a>.\n    </body>\n</html>"
