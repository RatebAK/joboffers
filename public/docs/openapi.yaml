  /api/job-seeker/apply:
    post:
      summary: 'Apply to job'
      operationId: applyToJob
      description: "Submit an application for an active job post. If no resume file is uploaded, the profile's stored CV is used automatically.\n\n## How Uploaded CVs Benefit Your Application\n\nWhen you have an uploaded and AI-analyzed CV in your profile, your application gains several advantages:\n\n1. **Automatic Resume Attachment**: Your stored CV is automatically attached to applications if you don't provide a separate resume file\n2. **ATS Score Visibility**: Employers see your ATS (Applicant Tracking System) score when reviewing applications\n3. **AI-Extracted Profile Data**: Employers can see your AI-extracted skills, work history, and education\n4. **Better Job Matching**: AI-analyzed profiles get better matches through the matching services\n5. **Default Cover Letter**: Set a default cover letter that's automatically used if you don't provide one\n\n## Steps to Apply with Uploaded CV:\n1. Upload CV: `POST /job-seeker/resume/upload-and-analyze` or `POST /job-seeker/resume/upload`\n2. Apply to job: `POST /job-seeker/apply` with `job_post_id`\n3. Your stored CV will be automatically attached"
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Application submitted successfully'
                  application:
                    id: 664f1a2b3c4d5e6f7a8b9c0f
                    job_post_id: 664f1a2b3c4d5e6f7a8b9c0d
                    status: pending
                    applied_at: '2024-01-15T00:00:00Z'
                    resume: 'https://res.cloudinary.com/.../cv.pdf'
                properties:
                  message:
                    type: string
                    example: 'Application submitted successfully'
                  application:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 664f1a2b3c4d5e6f7a8b9c0f
                      job_post_id:
                        type: string
                        example: 664f1a2b3c4d5e6f7a8b9c0d
                      status:
                        type: string
                        example: pending
                      applied_at:
                        type: string
                        example: '2024-01-15T00:00:00Z'
                      resume:
                        type: string
                        example: 'https://res.cloudinary.com/.../cv.pdf'
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Job post not found or is not active'
                properties:
                  message:
                    type: string
                    example: 'Job post not found or is not active'
        409:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'You have already applied to this job'
                properties:
                  message:
                    type: string
                    example: 'You have already applied to this job'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                job_post_id:
                  type: string
                  description: 'The ID of the job post to apply to.'
                  example: 664f1a2b3c4d5e6f7a8b9c0d
                cover_letter:
                  type: string
                  description: 'Optional cover letter. Max 1000 chars.'
                  example: 'I am very interested in this position.'
                  nullable: true
                resume:
                  type: string
                  format: binary
                  description: 'Optional PDF/DOC resume file (max 5 MB). Overrides profile CV.'
                  nullable: true
                education:
                  type: string
                  description: 'Optional education summary. Max 255 chars.'
                  example: architecto
                  nullable: true
                last_work:
                  type: string
                  description: 'Optional last work experience. Max 255 chars.'
                  example: architecto
                  nullable: true
                years_of_experience:
                  type: integer
                  description: 'Optional years of experience. Min 0, max 60.'
                  example: 16
                  nullable: true
                why_join:
                  type: string
                  description: 'Optional motivation for joining. Max 2000 chars.'
                  example: architecto
                  nullable: true
                what_to_add:
                  type: string
                  description: 'Optional skills/contributions you can add. Max 2000 chars.'
                  example: architecto
                  nullable: true
                positions_suited_for:
                  type: array
                  description: 'Optional array of suitable positions.'
                  example:
                    - architecto
                  items:
                    type: string
                notice_period:
                  type: string
                  description: 'Optional notice period. Max 100 chars.'
                  example: architecto
                  nullable: true
                expected_salary:
                  type: string
                  description: 'Optional expected salary. Max 100 chars.'
                  example: architecto
                  nullable: true
              required:
                - job_post_id
