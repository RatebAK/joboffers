        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Must be at least 2 characters. Must not be greater than 100 characters.'
                  example: b
                email:
                  type: string
                  description: 'Must be a valid email address. Must not be greater than 100 characters.'
                  example: zbailey@example.net
                password:
                  type: string
                  description: 'Must match the regex /[a-z]/. Must match the regex /[A-Z]/. Must match the regex /[0-9]/. Must match the regex /[@$!%*#?&]/. Must be at least 8 characters.'
                  example: '-0pBNvYgxw'
                role:
                  type: string
                  description: ''
                  example: employer
                  enum:
                    - admin
                    - employer
                    - employee
                  nullable: true
              required:
                - name
                - email
                - password
