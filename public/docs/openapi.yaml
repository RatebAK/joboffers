  /api/job-seeker/resume/upload-and-analyze:
    post:
      summary: 'Upload and analyze CV'
      operationId: uploadAndAnalyzeCV
      description: "Uploads a CV file and sends it to the AI analysis service. On success, populates all `ai_*` profile fields and `ats_score`.\nThis endpoint is similar to `/upload` but accepts field name `cv` instead of `resume`.\n\n## How Uploaded CVs Benefit Job Applications:\n\nUploading a CV enables automatic job applications and provides these advantages:\n\n1. **Automatic Application Attachments**: Your CV is automatically attached when you apply to jobs\n2. **ATS Score Generation**: Get an ATS score that employers use to filter candidates (65+ is recommended)\n3. **AI-Powered Profile**: Skills, work history, education are automatically extracted\n4. **Better Visibility**: Employers see your complete AI-analyzed profile with extracted data\n5. **Job Matching**: Enables AI-powered job matching services\n6. **Resume Coach**: Get AI-powered resume improvement suggestions\n\n## Workflow for Job Applications:\n1. Upload CV → Get AI analysis → ATS score generated\n2. Apply to jobs → Your CV automatically attached\n3. Employers see → Your ATS score + AI-extracted skills"
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'CV uploaded successfully. Analysis is being processed.'
                  resume_url: 'https://res.cloudinary.com/.../cv.pdf'
                  analysis_status: pending
                  profile:
                    id: 664f1a2b3c4d5e6f7a8b9c0d
                    ats_score: null
                    ai_skills: []
                    ai_work_history: []
                    ai_analyzed_at: null
                    analysis_status: pending
                properties:
                  message:
                    type: string
                    example: 'CV uploaded successfully. Analysis is being processed.'
                  resume_url:
                    type: string
                    example: 'https://res.cloudinary.com/.../cv.pdf'
                  analysis_status:
                    type: string
                    example: pending
                  profile:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 664f1a2b3c4d5e6f7a8b9c0d
                      ats_score:
                        type: string
                        example: null
                        nullable: true
                      ai_skills:
                        type: array
                        example: []
                      ai_work_history:
                        type: array
                        example: []
                      ai_analyzed_at:
                        type: string
                        example: null
                        nullable: true
                      analysis_status:
                        type: string
                        example: pending
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'CV analysis failed'
                  reason: 'CV content could not be parsed.'
                properties:
                  message:
                    type: string
                    example: 'CV analysis failed'
                  reason:
                    type: string
                    example: 'CV content could not be parsed.'
        502:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'CV analysis service unavailable'
                properties:
                  message:
                    type: string
                    example: 'CV analysis service unavailable'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                cv:
                  type: string
                  format: binary
                  description: 'PDF/DOC/DOCX file, max 10 MB.'
              required:
                - cv
