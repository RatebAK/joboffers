                  experience_level:
                    type: string
                    example: senior
                  location:
                    type: string
                    example: 'Beirut, Lebanon'
                  is_active:
                    type: boolean
                    example: true
        404:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Job post not found'
                properties:
                  message:
                    type: string
                    example: 'Job post not found'
      tags:
        - Endpoints
      security: []
    parameters:
      -
        in: path
        name: id
        description: 'The job post ID.'
        example: 664f1a2b3c4d5e6f7a8b9c0d
        required: true
        schema:
          type: string
  /api/companies:
