  /api/admin/onboarding/bulk:
    post:
      summary: 'Bulk employer onboarding via CSV upload'
      operationId: bulkEmployerOnboardingViaCSVUpload
      description: "[NEW API] Accepts a CSV file of employer accounts and creates pending User + Employer records for each\nvalid row, dispatching invite emails asynchronously.\n\n## CSV Format\nRequired columns: `name`, `email`, `company_name`\nOptional column: `partner_type` (values: `agency`, `university`, `enterprise`)\n\nExample CSV:\n```\nname,email,company_name,partner_type\nAcme HR,hr@acme.com,Acme Corp,agency\nState University,careers@university.edu,State University,university\n```\n\nRows missing required columns or with duplicate emails are skipped and reported in the response."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  total_rows: 5
                  created: 4
                  skipped: 1
                  skipped_rows:
                    -
                      email: existing@example.com
                      reason: email_exists
                properties:
                  total_rows:
                    type: integer
                    example: 5
                  created:
                    type: integer
                    example: 4
                  skipped:
                    type: integer
                    example: 1
                  skipped_rows:
                    type: array
                    example:
                      -
                        email: existing@example.com
                        reason: email_exists
                    items:
                      type: object
                      properties:
                        email:
                          type: string
                          example: existing@example.com
                        reason:
                          type: string
                          example: email_exists
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    file:
                      - 'File must be a valid CSV.'
                properties:
                  errors:
                    type: object
                    properties:
                      file:
                        type: array
                        example:
                          - 'File must be a valid CSV.'
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
                  description: 'CSV file, max 2 MB. Required columns: name, email, company_name.'
              required:
                - file
  /api/admin/broadcast:
    post:
      summary: 'Send a platform-wide broadcast'
      operationId: sendAPlatformWideBroadcast
      description: "[NEW API] Dispatches an email and in-app notification to a defined audience. Email delivery and\nin-app notification creation are processed asynchronously via Laravel queues.\n\nAudience values: `employees` (all job seekers), `employers` (all approved employers),\n`all` (everyone except admins). Alternatively, provide `user_ids` to target specific users."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  status: queued
                  recipient_count: 142
                properties:
                  status:
                    type: string
                    example: queued
                  recipient_count:
                    type: integer
                    example: 142
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  errors:
                    subject:
                      - 'The subject field is required.'
                properties:
                  errors:
                    type: object
                    properties:
                      subject:
                        type: array
                        example:
                          - 'The subject field is required.'
                        items:
                          type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                subject:
                  type: string
                  description: 'Notification subject line.'
                  example: 'New feature launch'
                body:
                  type: string
                  description: 'Notification body text.'
                  example: 'We just launched job matching AI!'
                audience:
                  type: string
                  description: 'when user_ids not provided. One of: employees, employers, all.'
                  example: employees
                  nullable: true
                user_ids:
                  type: array
                  description: 'Optional array of specific user IDs to target (overrides audience).'
                  example:
                    - architecto
                  items:
                    type: string
              required:
                - subject
                - body
                - audience
