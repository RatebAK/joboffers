openapi: 3.0.3
info:
  title: 'Laravel API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Endpoints
    description: ''
  -
    name: 'Lookup Tables'
    description: 'Admin-managed reference lists for categories, cities, and roles. Public endpoints return the full list (no pagination). Admin endpoints require authentication with the admin role.'
  -
    name: 'Resume Coach'
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/auth/register:
    post:
      summary: Register
      operationId: register
      description: 'Create a new user account. Returns a JWT token on success.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'User successfully registered'
                  user:
                    id: 664f1a2b3c4d5e6f7a8b9c0d
                    name: 'Jane Smith'
                    email: jane@example.com
                    roles:
                      - employee
                  access_token: eyJ...
                  token_type: bearer
                  expires_in: 3600
                properties:
                  message:
                    type: string
                    example: 'User successfully registered'
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 664f1a2b3c4d5e6f7a8b9c0d
                      name:
                        type: string
                        example: 'Jane Smith'
                      email:
                        type: string
                        example: jane@example.com
                      roles:
                        type: array
                        example:
                          - employee
                        items:
                          type: string
                  access_token:
                    type: string
                    example: eyJ...
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3600
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  email:
                    - 'The email has already been taken.'
                properties:
                  email:
                    type: array
                    example:
                      - 'The email has already been taken.'
                    items:
                      type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Display name. Min 2, max 100 chars.'
                  example: 'Jane Smith'
                email:
                  type: string
                  description: 'Valid email address.'
                  example: jane@example.com
                password:
                  type: string
                  description: 'Min 8 chars, must include uppercase, lowercase, digit, and special character.'
                  example: Secret@123
                role:
                  type: string
                  description: 'Role to assign. Defaults to `employee`.'
                  example: employee
                  nullable: true
                password_confirmation:
                  type: string
                  description: 'Must match password.'
                  example: Secret@123
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/auth/login:
    post:
      summary: Login
      operationId: login
      description: 'Authenticate with email and password. Returns a JWT bearer token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  access_token: eyJ...
                  token_type: bearer
                  expires_in: 3600
                  user:
                    id: 664f1a2b3c4d5e6f7a8b9c0d
                    name: 'Jane Smith'
                    email: jane@example.com
                    roles:
                      - employee
                properties:
                  access_token:
                    type: string
                    example: eyJ...
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3600
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 664f1a2b3c4d5e6f7a8b9c0d
                      name:
                        type: string
                        example: 'Jane Smith'
                      email:
                        type: string
                        example: jane@example.com
                      roles:
                        type: array
                        example:
                          - employee
                        items:
                          type: string
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: Unauthorized
                  message: 'Invalid credentials'
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: 'Invalid credentials'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: jane@example.com
                password:
                  type: string
                  description: ''
                  example: Secret@123
              required:
                - email
                - password
      security: []
  /api/auth/profile:
    get:
      summary: 'Get profile'
      operationId: getProfile
      description: "Returns the authenticated user's account details."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 664f1a2b3c4d5e6f7a8b9c0d
                  name: 'Jane Smith'
                  email: jane@example.com
                  roles:
                    - employee
                  is_employer: false
                properties:
                  id:
                    type: string
                    example: 664f1a2b3c4d5e6f7a8b9c0d
                  name:
                    type: string
                    example: 'Jane Smith'
                  email:
                    type: string
                    example: jane@example.com
                  roles:
                    type: array
                    example:
                      - employee
                    items:
                      type: string
                  is_employer:
                    type: boolean
                    example: false
      tags:
        - Endpoints
  /api/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Invalidates the current JWT token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'User successfully signed out'
                properties:
                  message:
                    type: string
                    example: 'User successfully signed out'
      tags:
        - Endpoints
  /api/auth/refresh:
    post:
      summary: 'Refresh token'
      operationId: refreshToken
      description: 'Issues a new JWT token using the current (still-valid) token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  access_token: eyJ...
                  token_type: bearer
                  expires_in: 3600
                  user:
                    id: 664f1a2b3c4d5e6f7a8b9c0d
                    name: 'Jane Smith'
                    email: jane@example.com
                properties:
                  access_token:
                    type: string
                    example: eyJ...
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3600
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 664f1a2b3c4d5e6f7a8b9c0d
                      name:
                        type: string
                        example: 'Jane Smith'
                      email:
                        type: string
                        example: jane@example.com
      tags:
        - Endpoints
  /api/categories:
    get:
      summary: 'List categories (public)'
      operationId: listCategoriespublic
      description: 'Returns all categories ordered by name. No authentication required.'
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 664f1a2b3c4d5e6f7a8b9c0d
                      name: Engineering
                      created_at: '2026-01-01T00:00:00.000000Z'
                      updated_at: '2026-01-01T00:00:00.000000Z'
                    -
                      id: 664f1a2b3c4d5e6f7a8b9c0e
                      name: Technology
                      created_at: '2026-01-01T00:00:00.000000Z'
                      updated_at: '2026-01-01T00:00:00.000000Z'
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 664f1a2b3c4d5e6f7a8b9c0d
                        name: Engineering
                        created_at: '2026-01-01T00:00:00.000000Z'
                        updated_at: '2026-01-01T00:00:00.000000Z'
                      -
                        id: 664f1a2b3c4d5e6f7a8b9c0e
                        name: Technology
                        created_at: '2026-01-01T00:00:00.000000Z'
                        updated_at: '2026-01-01T00:00:00.000000Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 664f1a2b3c4d5e6f7a8b9c0d
                        name:
                          type: string
                          example: Engineering
                        created_at:
                          type: string
                          example: '2026-01-01T00:00:00.000000Z'
                        updated_at:
                          type: string
                          example: '2026-01-01T00:00:00.000000Z'
      tags:
        - Endpoints
      security: []
  /api/cities:
    get:
      summary: 'List cities (public)'
      operationId: listCitiespublic
      description: 'Returns all cities ordered by name. Used to power location autocomplete. No authentication required.'
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 664f1a2b3c4d5e6f7a8b9c0d
                      name: Aleppo
                      created_at: '2026-01-01T00:00:00.000000Z'
                      updated_at: '2026-01-01T00:00:00.000000Z'
                    -
                      id: 664f1a2b3c4d5e6f7a8b9c0e
                      name: Damascus
                      created_at: '2026-01-01T00:00:00.000000Z'
                      updated_at: '2026-01-01T00:00:00.000000Z'
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 664f1a2b3c4d5e6f7a8b9c0d
                        name: Aleppo
                        created_at: '2026-01-01T00:00:00.000000Z'
                        updated_at: '2026-01-01T00:00:00.000000Z'
                      -
                        id: 664f1a2b3c4d5e6f7a8b9c0e
                        name: Damascus
                        created_at: '2026-01-01T00:00:00.000000Z'
                        updated_at: '2026-01-01T00:00:00.000000Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 664f1a2b3c4d5e6f7a8b9c0d
                        name:
                          type: string
                          example: Aleppo
                        created_at:
                          type: string
                          example: '2026-01-01T00:00:00.000000Z'
                        updated_at:
                          type: string
                          example: '2026-01-01T00:00:00.000000Z'
      tags:
        - Endpoints
      security: []
  /api/roles:
    get:
      summary: 'List roles (public)'
      operationId: listRolespublic
      description: 'Returns all job roles ordered by name. Used to power role autocomplete. No authentication required.'
      parameters: []
      responses:
        200:
          description: Success
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 664f1a2b3c4d5e6f7a8b9c0d
                      name: 'Backend Developer'
                      created_at: '2026-01-01T00:00:00.000000Z'
                      updated_at: '2026-01-01T00:00:00.000000Z'
                    -
                      id: 664f1a2b3c4d5e6f7a8b9c0e
                      name: 'DevOps Engineer'
                      created_at: '2026-01-01T00:00:00.000000Z'
                      updated_at: '2026-01-01T00:00:00.000000Z'
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 664f1a2b3c4d5e6f7a8b9c0d
                        name: 'Backend Developer'
                        created_at: '2026-01-01T00:00:00.000000Z'
                        updated_at: '2026-01-01T00:00:00.000000Z'
                      -
                        id: 664f1a2b3c4d5e6f7a8b9c0e
                        name: 'DevOps Engineer'
                        created_at: '2026-01-01T00:00:00.000000Z'
                        updated_at: '2026-01-01T00:00:00.000000Z'
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          example: 664f1a2b3c4d5e6f7a8b9c0d
                        name:
                          type: string
                          example: 'Backend Developer'
                        created_at:
                          type: string
                          example: '2026-01-01T00:00:00.000000Z'
                        updated_at:
                          type: string
                          example: '2026-01-01T00:00:00.000000Z'
      tags:
        - Endpoints
      security: []
  /api/jobs:
    get:
      summary: 'List jobs'
      operationId: listJobs
      description: 'Paginated list of active job posts with optional filters.'
      parameters:
        -
          in: query
          name: keyword
          description: 'Search in title, description, company name.'
          example: Laravel
          required: false
          schema:
            type: string
            description: 'Search in title, description, company name.'
            example: Laravel
        -
          in: query
          name: city
          description: 'Filter by city.'
          example: Damascus
          required: false
          schema:
            type: string
            description: 'Filter by city.'
            example: Damascus
        -
          in: query
          name: job_type
          description: 'Filter: full_time | part_time | contract | freelance.'
          example: full_time
          required: false
          schema:
            type: string
            description: 'Filter: full_time | part_time | contract | freelance.'
            example: full_time
        -
          in: query
          name: work_mode
          description: 'Filter: remote | hybrid | on_site.'
          example: remote
          required: false
          schema:
            type: string
            description: 'Filter: remote | hybrid | on_site.'
            example: remote
        -
          in: query
          name: job_level
          description: 'Filter: entry | junior | mid | senior | manager | director.'
          example: senior
          required: false
          schema:
            type: string
            description: 'Filter: entry | junior | mid | senior | manager | director.'
            example: senior
        -
          in: query
          name: experience_years
          description: 'Filter by required experience (lte).'
          example: 3
          required: false
          schema:
            type: integer
            description: 'Filter by required experience (lte).'
            example: 3
        -
          in: query
          name: category
          description: 'Filter by category.'
          example: Engineering
          required: false
          schema:
            type: string
            description: 'Filter by category.'
            example: Engineering
        -
          in: query
          name: min_salary
          description: 'Minimum salary_from.'
          example: 500
          required: false
          schema:
            type: integer
            description: 'Minimum salary_from.'
            example: 500
        -
          in: query
          name: max_salary
          description: 'Maximum salary_to.'
          example: 3000
          required: false
          schema:
            type: integer
            description: 'Maximum salary_to.'
            example: 3000
        -
          in: query
          name: tag
          description: 'Filter by tag.'
          example: React
          required: false
          schema:
            type: string
            description: 'Filter by tag.'
            example: React
        -
          in: query
          name: communication_method
          description: 'Filter: by_phone | by_forsa | by_website.'
          example: by_forsa
          required: false
          schema:
            type: string
            description: 'Filter: by_phone | by_forsa | by_website.'
            example: by_forsa
        -
          in: query
          name: per_page
          description: 'Max 100, default 15.'
          example: 10
          required: false
          schema:
            type: integer
            description: 'Max 100, default 15.'
            example: 10
        -
          in: query
          name: page
          description: 'Page number.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number.'
            example: 1
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      _id: 664f1a2b3c4d5e6f7a8b9c0d
                      job_id: JOB-0001
                      employer_id: 664f1a2b3c4d5e6f7a8b9c0e
                      company_profile_id: 664f1a2b3c4d5e6f7a8b9c0f
                      company_name: 'Acme Corp'
                      company_logo: 'https://example.com/logo.png'
                      title: 'Senior Laravel Developer'
                      description: 'We are looking for...'
                      requirements: '3+ years Laravel experience.'
                      roles:
                        - Backend
                        - PHP
                      category: Engineering
                      tags:
                        - Laravel
                        - MongoDB
                      job_type: full_time
                      work_mode: on_site
