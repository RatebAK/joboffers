openapi: 3.0.3
info:
  title: 'Laravel API Documentation'
  description: ''
  version: 1.0.0
servers:
  -
    url: 'http://localhost:8000'
tags:
  -
    name: Endpoints
    description: ''
components:
  securitySchemes:
    default:
      type: http
      scheme: bearer
      description: 'You can retrieve your token by visiting your dashboard and clicking <b>Generate API token</b>.'
security:
  -
    default: []
paths:
  /api/auth/register:
    post:
      summary: Register
      operationId: register
      description: 'Create a new user account. Returns a JWT token on success.'
      parameters: []
      responses:
        201:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'User successfully registered'
                  user:
                    id: 664f1a2b3c4d5e6f7a8b9c0d
                    name: 'Jane Smith'
                    email: jane@example.com
                    roles:
                      - employee
                  access_token: eyJ...
                  token_type: bearer
                  expires_in: 3600
                properties:
                  message:
                    type: string
                    example: 'User successfully registered'
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 664f1a2b3c4d5e6f7a8b9c0d
                      name:
                        type: string
                        example: 'Jane Smith'
                      email:
                        type: string
                        example: jane@example.com
                      roles:
                        type: array
                        example:
                          - employee
                        items:
                          type: string
                  access_token:
                    type: string
                    example: eyJ...
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3600
        422:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  email:
                    - 'The email has already been taken.'
                properties:
                  email:
                    type: array
                    example:
                      - 'The email has already been taken.'
                    items:
                      type: string
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                  description: 'Display name. Min 2, max 100 chars.'
                  example: 'Jane Smith'
                email:
                  type: string
                  description: 'Valid email address.'
                  example: jane@example.com
                password:
                  type: string
                  description: 'Min 8 chars, must include uppercase, lowercase, digit, and special character.'
                  example: Secret@123
                role:
                  type: string
                  description: 'Role to assign. Defaults to `employee`.'
                  example: employee
                  nullable: true
                password_confirmation:
                  type: string
                  description: 'Must match password.'
                  example: Secret@123
              required:
                - name
                - email
                - password
                - password_confirmation
      security: []
  /api/auth/login:
    post:
      summary: Login
      operationId: login
      description: 'Authenticate with email and password. Returns a JWT bearer token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  access_token: eyJ...
                  token_type: bearer
                  expires_in: 3600
                  user:
                    id: 664f1a2b3c4d5e6f7a8b9c0d
                    name: 'Jane Smith'
                    email: jane@example.com
                    roles:
                      - employee
                properties:
                  access_token:
                    type: string
                    example: eyJ...
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3600
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 664f1a2b3c4d5e6f7a8b9c0d
                      name:
                        type: string
                        example: 'Jane Smith'
                      email:
                        type: string
                        example: jane@example.com
                      roles:
                        type: array
                        example:
                          - employee
                        items:
                          type: string
        401:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  error: Unauthorized
                  message: 'Invalid credentials'
                properties:
                  error:
                    type: string
                    example: Unauthorized
                  message:
                    type: string
                    example: 'Invalid credentials'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  description: ''
                  example: jane@example.com
                password:
                  type: string
                  description: ''
                  example: Secret@123
              required:
                - email
                - password
      security: []
  /api/auth/profile:
    get:
      summary: 'Get profile'
      operationId: getProfile
      description: "Returns the authenticated user's account details."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 664f1a2b3c4d5e6f7a8b9c0d
                  name: 'Jane Smith'
                  email: jane@example.com
                  roles:
                    - employee
                  is_employer: false
                properties:
                  id:
                    type: string
                    example: 664f1a2b3c4d5e6f7a8b9c0d
                  name:
                    type: string
                    example: 'Jane Smith'
                  email:
                    type: string
                    example: jane@example.com
                  roles:
                    type: array
                    example:
                      - employee
                    items:
                      type: string
                  is_employer:
                    type: boolean
                    example: false
      tags:
        - Endpoints
  /api/auth/logout:
    post:
      summary: Logout
      operationId: logout
      description: 'Invalidates the current JWT token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'User successfully signed out'
                properties:
                  message:
                    type: string
                    example: 'User successfully signed out'
      tags:
        - Endpoints
  /api/auth/refresh:
    post:
      summary: 'Refresh token'
      operationId: refreshToken
      description: 'Issues a new JWT token using the current (still-valid) token.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  access_token: eyJ...
                  token_type: bearer
                  expires_in: 3600
                  user:
                    id: 664f1a2b3c4d5e6f7a8b9c0d
                    name: 'Jane Smith'
                    email: jane@example.com
                properties:
                  access_token:
                    type: string
                    example: eyJ...
                  token_type:
                    type: string
                    example: bearer
                  expires_in:
                    type: integer
                    example: 3600
                  user:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 664f1a2b3c4d5e6f7a8b9c0d
                      name:
                        type: string
                        example: 'Jane Smith'
                      email:
                        type: string
                        example: jane@example.com
      tags:
        - Endpoints
  /api/jobs:
    get:
      summary: 'List jobs'
      operationId: listJobs
      description: 'Paginated list of active job posts with optional filters.'
      parameters:
        -
          in: query
          name: keyword
          description: 'Search in title, description, company name.'
          example: Laravel
          required: false
          schema:
            type: string
            description: 'Search in title, description, company name.'
            example: Laravel
        -
          in: query
          name: location
          description: 'Filter by location (partial match).'
          example: Beirut
          required: false
          schema:
            type: string
            description: 'Filter by location (partial match).'
            example: Beirut
        -
          in: query
          name: job_type
          description: 'Filter by type.'
          example: full_time
          required: false
          schema:
            type: string
            description: 'Filter by type.'
            example: full_time
        -
          in: query
          name: work_mode
          description: 'Filter by work mode.'
          example: remote
          required: false
          schema:
            type: string
            description: 'Filter by work mode.'
            example: remote
        -
          in: query
          name: experience_level
          description: 'Filter by level.'
          example: senior
          required: false
          schema:
            type: string
            description: 'Filter by level.'
            example: senior
        -
          in: query
          name: category
          description: 'Filter by category.'
          example: Engineering
          required: false
          schema:
            type: string
            description: 'Filter by category.'
            example: Engineering
        -
          in: query
          name: min_salary
          description: 'Minimum salary range.'
          example: 2000
          required: false
          schema:
            type: integer
            description: 'Minimum salary range.'
            example: 2000
        -
          in: query
          name: max_salary
          description: 'Maximum salary range.'
          example: 8000
          required: false
          schema:
            type: integer
            description: 'Maximum salary range.'
            example: 8000
        -
          in: query
          name: tag
          description: 'Filter by tag.'
          example: React
          required: false
          schema:
            type: string
            description: 'Filter by tag.'
            example: React
        -
          in: query
          name: per_page
          description: 'Results per page (max 100). Defaults to 15.'
          example: 10
          required: false
          schema:
            type: integer
            description: 'Results per page (max 100). Defaults to 15.'
            example: 10
        -
          in: query
          name: page
          description: 'Page number.'
          example: 1
          required: false
          schema:
            type: integer
            description: 'Page number.'
            example: 1
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  data:
                    -
                      id: 664f1a2b3c4d5e6f7a8b9c0d
                      job_id: JOB-001
                      title: 'Senior Laravel Developer'
                      description: 'We are looking for...'
                      requirements: 'Minimum 3 years...'
                      company_name: 'Acme Corp'
                      company_logo: 'https://logo.clearbit.com/acme.com'
                      job_type: full_time
                      work_mode: remote
                      experience_level: senior
                      experience_required: '5+ years'
                      location: 'Beirut, Lebanon'
                      category: Engineering
                      salary_range:
                        min: 2000
                        max: 4000
                        currency: USD
                      tags:
                        - Laravel
                        - PHP
                      is_active: true
                      employer_id: 664f1a2b3c4d5e6f7a8b9c0e
                      created_at: '2024-01-15T00:00:00Z'
                  current_page: 1
                  per_page: 15
                  total: 1
                  total_pages: 1
                  next_page: null
                  prev_page: null
                properties:
                  data:
                    type: array
                    example:
                      -
                        id: 664f1a2b3c4d5e6f7a8b9c0d
                        job_id: JOB-001
                        title: 'Senior Laravel Developer'
                        description: 'We are looking for...'
