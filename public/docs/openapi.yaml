  /api/jobs/search:
    get:
      summary: 'Search jobs'
      operationId: searchJobs
      description: 'Paginated search of active job posts for the authenticated job seeker.'
      parameters:
        -
          in: query
          name: keyword
          description: 'Search in title, description, company name. Max 100 chars.'
          example: React
          required: false
          schema:
            type: string
            description: 'Search in title, description, company name. Max 100 chars.'
            example: React
        -
          in: query
          name: location
          description: 'Partial location match. Max 100 chars.'
          example: Beirut
          required: false
          schema:
            type: string
            description: 'Partial location match. Max 100 chars.'
            example: Beirut
        -
          in: query
          name: job_type
          description: 'One of: full_time, part_time, contract, freelance.'
          example: full_time
