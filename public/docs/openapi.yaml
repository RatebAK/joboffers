  '/api/jobs/{id}':
    get:
      summary: 'Get job'
      operationId: getJob
      description: 'Returns a single active job post by ID.'
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  id: 664f1a2b3c4d5e6f7a8b9c0d
                  job_id: JOB-001
                  title: 'Senior Laravel Developer'
                  company_name: 'Acme Corp'
                  job_type: full_time
