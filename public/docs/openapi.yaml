  /api/job-seeker/resume/upload:
    post:
      summary: 'Upload resume'
      operationId: uploadResume
      description: "Uploads a resume file to the job seeker's profile and triggers AI analysis.\nPopulates all `ai_*` profile fields and `ats_score` with extracted data.\n\n## How Uploaded Resumes Benefit Job Applications:\n\nUploading a resume enables automatic job applications and provides these advantages:\n\n1. **Automatic Application Attachments**: Your resume is automatically attached when you apply to jobs\n2. **ATS Score Generation**: Get an ATS score that employers use to filter candidates\n3. **AI-Powered Profile**: Skills, work history, education are automatically extracted\n4. **Better Visibility**: Employers see your complete AI-analyzed profile\n5. **Job Matching**: Enables AI-powered job matching services\n\n## Analysis Status Tracking:\n- `pending`: Uploaded, analysis not started\n- `processing`: Analysis in progress\n- `completed`: Analysis successful, profile updated\n- `error`: Analysis failed, resume still saved\n\nCheck status: `GET /job-seeker/resume/analysis-status`\nRetry failed: `POST /job-seeker/resume/retry-analysis`"
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Resume uploaded successfully. Analysis is being processed.'
                  resume_url: 'https://res.cloudinary.com/.../resume.pdf'
                  analysis_status: pending
                  profile:
                    id: 664f1a2b3c4d5e6f7a8b9c0d
                    ats_score: null
                    ai_skills: []
                    ai_analyzed_at: null
                    analysis_status: pending
                properties:
                  message:
                    type: string
                    example: 'Resume uploaded successfully. Analysis is being processed.'
                  resume_url:
                    type: string
                    example: 'https://res.cloudinary.com/.../resume.pdf'
                  analysis_status:
                    type: string
                    example: pending
                  profile:
                    type: object
                    properties:
                      id:
                        type: string
                        example: 664f1a2b3c4d5e6f7a8b9c0d
                      ats_score:
                        type: string
                        example: null
                        nullable: true
                      ai_skills:
                        type: array
                        example: []
                      ai_analyzed_at:
                        type: string
                        example: null
                        nullable: true
                      analysis_status:
                        type: string
                        example: pending
        422:
          description: ''
          content:
            application/json:
              schema:
                oneOf:
                  -
                    description: ''
                    type: object
                    example:
                      errors:
                        resume:
                          - 'The resume field is required.'
                    properties:
                      errors:
                        type: object
                        properties:
                          resume:
                            type: array
                            example:
                              - 'The resume field is required.'
                            items:
                              type: string
                  -
                    description: ''
                    type: object
                    example:
                      message: 'Resume analysis failed'
                      reason: 'Resume content could not be parsed.'
                    properties:
                      message:
                        type: string
                        example: 'Resume analysis failed'
                      reason:
                        type: string
                        example: 'Resume content could not be parsed.'
        502:
          description: ''
          content:
            application/json:
              schema:
                type: object
                example:
                  message: 'Resume analysis service unavailable'
                properties:
                  message:
                    type: string
                    example: 'Resume analysis service unavailable'
      tags:
        - Endpoints
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                resume:
                  type: string
                  format: binary
                  description: 'PDF/DOC/DOCX file, max 10 MB.'
              required:
                - resume
  /api/job-seeker/resume:
    delete:
      summary: 'Delete saved resume'
      operationId: deleteSavedResume
      description: "Removes the stored resume file from the job seeker's profile."
      parameters: []
      responses:
        200:
          description: ''
          content:
            application/json:
              schema:
